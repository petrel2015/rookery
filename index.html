<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />
    <link rel="icon" href="./favicon-32.png?v=2" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rookery · petrel2015 的个人项目墙：纯前端的小工具与小游戏合集。" />
    <title>Rookery · 个人项目墙</title>
    <script>
      // 首屏前恢复主题，避免暗色模式闪白
      ;(function () {
        try {
          var t = localStorage.getItem('pw-theme')
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
